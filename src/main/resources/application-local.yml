spring:
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_service_db}
    username: ${DB_USERNAME:app_runtime}
  liquibase:
    enabled: false
app:
  security:
    issuer: ${KEYCLOAK_ISSUER_URL:http://localhost:8081/realms/user-service}
    jwk-set-uri: ${KEYCLOAK_JWKS_URL:http://localhost:8081/realms/user-service/protocol/openid-connect/certs}
    cors-origins: ${CORS_ORIGINS:http://localhost:3000}
    docs-enabled: true
  keycloak:
    admin-base-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8081}
