spring:
  application:
    name: mpl-be
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 5000
      connection-init-sql: "SET lock_timeout = '10s'"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${APP_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
spring.lifecycle.timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
app:
  database-name: user_service_db
  security:
    issuer: ${KEYCLOAK_ISSUER_URL}
    jwk-set-uri: ${KEYCLOAK_JWKS_URL}
    audience: ${JWT_AUDIENCE:user-service-api}
    cors-origins: ${CORS_ORIGINS}
    docs-enabled: false
  keycloak:
    admin-base-url: ${KEYCLOAK_ADMIN_URL}
    realm: ${KEYCLOAK_REALM:user-service}
    client-id: ${KEYCLOAK_CLIENT_ID:user-service-admin}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    connect-timeout: 3s
    read-timeout: 5s
    allowed-realm-roles: USER
    allowed-client-roles: user-service-api:USER
  registration:
    max-attempts-per-hour: ${REGISTRATION_MAX_ATTEMPTS_PER_HOUR:10}
  sync:
    enabled: ${IDENTITY_SYNC_ENABLED:true}
    delay: ${IDENTITY_SYNC_DELAY_MS:10000}
springdoc:
  api-docs:
    enabled: ${app.security.docs-enabled}
  swagger-ui:
    enabled: ${app.security.docs-enabled}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.example.userservice: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.error: OFF
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
